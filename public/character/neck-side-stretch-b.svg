    <path d="M222,147 Q228,115 256,117 Q284,115 290,147" fill="#1C1917"/>
    <circle cx="244" cy="155" r="3.2" fill="#1C1917"/>
    <circle cx="268" cy="155" r="3.2" fill="#1C1917"/>
    <path d="M246,167 Q256,174 266,167" fill="none" stroke="#1C1917" stroke-width="2.5" stroke-linecap="round"/>
