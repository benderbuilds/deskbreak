    <circle cx="186" cy="332" r="7" fill="#FF5A36" stroke="#1C1917" stroke-width="2"/>
  </g>
  <g class="arm">
    <path d="M284,218 Q316,272 326,332" fill="none" stroke="#1C1917" stroke-width="10" stroke-linecap="round"/>
    <path d="M284,218 Q316,272 326,332" fill="none" stroke="#F3E6D8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="326" cy="332" r="7" fill="#FF5A36" stroke="#1C1917" stroke-width="2"/>
  </g>
  <g id="head" transform="rotate(0 256 190)">
