<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="DeskBreak Stretch — Unshrug, shoulders dropped away from ears (front)">
  <title>DeskBreak Stretch — Unshrug, shoulders dropped away from ears (front)</title>
  <rect width="512" height="512" fill="none"/>
  <ellipse cx="256" cy="468" rx="110" ry="10" fill="#E7E2DA" opacity="0.55"/>
  <g id="chair">
    <rect x="168" y="300" width="176" height="90" rx="18" fill="#E7E2DA" stroke="#1C1917" stroke-width="3.0"/>
    <rect x="180" y="230" width="22" height="78" rx="8" fill="#E7E2DA" stroke="#1C1917" stroke-width="3.0"/>
    <rect x="310" y="230" width="22" height="78" rx="8" fill="#E7E2DA" stroke="#1C1917" stroke-width="3.0"/>
  </g>
  <g id="legs">
    <path d="M220,320 L200,430" fill="none" stroke="#1C1917" stroke-width="12" stroke-linecap="round"/>
    <path d="M292,320 L312,430" fill="none" stroke="#1C1917" stroke-width="12" stroke-linecap="round"/>
    <path d="M220,320 L200,430" fill="none" stroke="#D6D0C6" stroke-width="7" stroke-linecap="round"/>
    <path d="M292,320 L312,430" fill="none" stroke="#D6D0C6" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="200" cy="436" rx="18" ry="8" fill="#1C1917"/>
    <ellipse cx="312" cy="436" rx="18" ry="8" fill="#1C1917"/>
  </g>
  <g id="torso">
    <rect x="221" y="214" width="70" height="86" rx="22" fill="#FFFFFF" stroke="#1C1917" stroke-width="3.0"/>
  </g>
  <!-- long neck: gap between ears and shoulders -->
  <path d="M240,196 L240,214" stroke="#2DD4A8" stroke-width="4" stroke-linecap="round"/>
  <path d="M272,196 L272,214" stroke="#2DD4A8" stroke-width="4" stroke-linecap="round"/>
  <g class="arm">
    <path d="M228,230 Q198,286 190,344" fill="none" stroke="#1C1917" stroke-width="10" stroke-linecap="round"/>
    <path d="M228,230 Q198,286 190,344" fill="none" stroke="#F3E6D8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="190" cy="344" r="7" fill="#FF5A36" stroke="#1C1917" stroke-width="2"/>
  </g>
  <g class="arm">
    <path d="M284,230 Q314,286 322,344" fill="none" stroke="#1C1917" stroke-width="10" stroke-linecap="round"/>
    <path d="M284,230 Q314,286 322,344" fill="none" stroke="#F3E6D8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="322" cy="344" r="7" fill="#FF5A36" stroke="#1C1917" stroke-width="2"/>
  </g>
  <!-- shoulders travel down -->
  <path d="M170,222 L170,258" stroke="#FF5A36" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M163,248 L170,260 L177,248" fill="none" stroke="#FF5A36" stroke-width="2.5" stroke-linejoin="round" opacity="0.75"/>
  <path d="M342,222 L342,258" stroke="#FF5A36" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M335,248 L342,260 L349,248" fill="none" stroke="#FF5A36" stroke-width="2.5" stroke-linejoin="round" opacity="0.75"/>
  <g id="head">
    <circle cx="256" cy="155" r="36" fill="#F3E6D8" stroke="#1C1917" stroke-width="3.0"/>
    <path d="M222,147 Q228,115 256,117 Q284,115 290,147" fill="#1C1917"/>
    <circle cx="244" cy="155" r="3.2" fill="#1C1917"/>
    <circle cx="268" cy="155" r="3.2" fill="#1C1917"/>
    <path d="M244,168 Q256,177 268,168" fill="none" stroke="#1C1917" stroke-width="2.5" stroke-linecap="round"/>
  </g>
