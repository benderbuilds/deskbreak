<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="DeskBreak Stretch — Neck side stretch, ear toward shoulder (front)">
  <title>DeskBreak Stretch — Neck side stretch, ear toward shoulder (front)</title>
  <rect width="512" height="512" fill="none"/>
  <ellipse cx="256" cy="468" rx="110" ry="10" fill="#DCE3E9" opacity="0.55"/>
  <g id="chair">
    <rect x="168" y="300" width="176" height="90" rx="18" fill="#DCE3E9" stroke="#22343B" stroke-width="3.0"/>
    <rect x="180" y="230" width="22" height="78" rx="8" fill="#DCE3E9" stroke="#22343B" stroke-width="3.0"/>
    <rect x="310" y="230" width="22" height="78" rx="8" fill="#DCE3E9" stroke="#22343B" stroke-width="3.0"/>
  </g>
  <g id="legs">
    <path d="M220,320 L200,430" fill="none" stroke="#22343B" stroke-width="12" stroke-linecap="round"/>
    <path d="M292,320 L312,430" fill="none" stroke="#22343B" stroke-width="12" stroke-linecap="round"/>
    <path d="M220,320 L200,430" fill="none" stroke="#ACC0D3" stroke-width="7" stroke-linecap="round"/>
    <path d="M292,320 L312,430" fill="none" stroke="#ACC0D3" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="200" cy="436" rx="18" ry="8" fill="#22343B"/>
    <ellipse cx="312" cy="436" rx="18" ry="8" fill="#22343B"/>
  </g>
  <g id="torso">
    <rect x="221" y="200" width="70" height="95" rx="22" fill="#FFFFFF" stroke="#22343B" stroke-width="3.0"/>
  </g>
  <!-- both shoulders stay level and down -->
  <path d="M214,206 L298,206" stroke="#22343B" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
  <g class="arm">
    <path d="M228,218 Q196,272 186,332" fill="none" stroke="#22343B" stroke-width="10" stroke-linecap="round"/>
    <path d="M228,218 Q196,272 186,332" fill="none" stroke="#F0DFC9" stroke-width="6" stroke-linecap="round"/>
    <circle cx="186" cy="332" r="7" fill="#BC7085" stroke="#22343B" stroke-width="2"/>
  </g>
  <g class="arm">
    <path d="M284,218 Q316,272 326,332" fill="none" stroke="#22343B" stroke-width="10" stroke-linecap="round"/>
    <path d="M284,218 Q316,272 326,332" fill="none" stroke="#F0DFC9" stroke-width="6" stroke-linecap="round"/>
    <circle cx="326" cy="332" r="7" fill="#BC7085" stroke="#22343B" stroke-width="2"/>
  </g>
  <!-- stretch line down the far side of the neck -->
  <path d="M232,186 Q222,206 224,214" fill="none" stroke="#09A1A1" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <!-- tilt arc -->
  <path d="M256,104 A46,46 0 0 1 296,132" fill="none" stroke="#BC7085" stroke-width="2.5" stroke-dasharray="6 5" opacity="0.7" stroke-linecap="round"/>
  <path d="M290,120 L297,133 L283,135" fill="none" stroke="#BC7085" stroke-width="2.5" opacity="0.7" stroke-linejoin="round"/>
  <g id="head" transform="rotate(24 256 190)">
    <circle cx="256" cy="155" r="36" fill="#F0DFC9" stroke="#22343B" stroke-width="3.0"/>
    <path d="M222,147 Q228,115 256,117 Q284,115 290,147" fill="#22343B"/>
    <circle cx="244" cy="155" r="3.2" fill="#22343B"/>
    <circle cx="268" cy="155" r="3.2" fill="#22343B"/>
    <path d="M246,167 Q256,174 266,167" fill="none" stroke="#22343B" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
