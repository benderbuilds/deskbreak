<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="DeskBreak Stretch - Upper trap release, ear down toward the armpit (front)">
  <title>DeskBreak Stretch - Upper trap release, ear down toward the armpit (front)</title>
  <rect width="512" height="512" fill="none"/>
  <ellipse cx="256" cy="468" rx="110" ry="10" fill="#E7E2DA" opacity="0.55"/>
  <g id="chair">
    <rect x="168" y="300" width="176" height="90" rx="18" fill="#E7E2DA" stroke="#1C1917" stroke-width="3.0"/>
    <rect x="180" y="230" width="22" height="78" rx="8" fill="#E7E2DA" stroke="#1C1917" stroke-width="3.0"/>
    <rect x="310" y="230" width="22" height="78" rx="8" fill="#E7E2DA" stroke="#1C1917" stroke-width="3.0"/>
  </g>
  <g id="legs">
    <path d="M220,320 L200,430" fill="none" stroke="#1C1917" stroke-width="12" stroke-linecap="round"/>
    <path d="M292,320 L312,430" fill="none" stroke="#1C1917" stroke-width="12" stroke-linecap="round"/>
    <path d="M220,320 L200,430" fill="none" stroke="#D6D0C6" stroke-width="7" stroke-linecap="round"/>
    <path d="M292,320 L312,430" fill="none" stroke="#D6D0C6" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="200" cy="436" rx="18" ry="8" fill="#1C1917"/>
    <ellipse cx="312" cy="436" rx="18" ry="8" fill="#1C1917"/>
  </g>
  <g id="torso">
    <rect x="221" y="204" width="70" height="94" rx="22" fill="#FFFFFF" stroke="#1C1917" stroke-width="3.0"/>
  </g>
  <!-- the opposite shoulder stays down -->
  <path d="M298,214 L298,246" stroke="#FF5A36" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M291,236 L298,248 L305,236" fill="none" stroke="#FF5A36" stroke-width="2.5" stroke-linejoin="round" opacity="0.75"/>
  <g class="arm">
    <path d="M290,216 Q320,272 328,332" fill="none" stroke="#1C1917" stroke-width="10" stroke-linecap="round"/>
    <path d="M290,216 Q320,272 328,332" fill="none" stroke="#F3E6D8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="328" cy="332" r="7" fill="#FF5A36" stroke="#1C1917" stroke-width="2"/>
  </g>
  <!-- stretch band from ear down to the far shoulder -->
  <path d="M272,182 Q286,206 296,216" fill="none" stroke="#2DD4A8" stroke-width="5" stroke-linecap="round"/>
  <g id="head" transform="rotate(-28 256 200)">
    <circle cx="256" cy="152" r="36" fill="#F3E6D8" stroke="#1C1917" stroke-width="3.0"/>
    <path d="M222,144 Q228,112 256,114 Q284,112 290,144" fill="#1C1917"/>
    <circle cx="244" cy="152" r="3.2" fill="#1C1917"/>
    <circle cx="268" cy="152" r="3.2" fill="#1C1917"/>
    <path d="M246,166 Q256,172 266,166" fill="none" stroke="#1C1917" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- guiding hand rests on the head, no pulling -->
  <g class="arm">
    <path d="M226,216 Q196,166 226,140" fill="none" stroke="#1C1917" stroke-width="10" stroke-linecap="round"/>
    <path d="M226,216 Q196,166 226,140" fill="none" stroke="#F3E6D8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="228" cy="139" r="7" fill="#FF5A36" stroke="#1C1917" stroke-width="2"/>
  </g>
</svg>
