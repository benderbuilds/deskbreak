<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="DeskBreak Stretch - Seated pelvic tilt, tail tipped back, low back arched (side)">
  <title>DeskBreak Stretch - Seated pelvic tilt, tail tipped back, low back arched (side)</title>
  <rect width="512" height="512" fill="none"/>
  <ellipse cx="256" cy="470" rx="120" ry="10" fill="#DCE3E9" opacity="0.5"/>
  <g id="chair">
    <rect x="190" y="330" width="150" height="28" rx="10" fill="#DCE3E9" stroke="#22343B" stroke-width="3.0"/>
    <rect x="180" y="220" width="24" height="120" rx="10" fill="#DCE3E9" stroke="#22343B" stroke-width="3.0"/>
    <rect x="210" y="358" width="14" height="70" rx="6" fill="#DCE3E9" stroke="#22343B" stroke-width="3.0"/>
    <rect x="310" y="358" width="14" height="70" rx="6" fill="#DCE3E9" stroke="#22343B" stroke-width="3.0"/>
  </g>
  <g id="leg">
    <path d="M250,340 L300,380 L320,450" fill="none" stroke="#22343B" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M250,340 L300,380 L320,450" fill="none" stroke="#ACC0D3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="320" cy="454" rx="22" ry="8" fill="#22343B"/>
  </g>
  <!-- spine rounds: tail tucks under, low back flattens -->
  <path d="M244,200 Q234,262 246,326" fill="none" stroke="#09A1A1" stroke-width="5" stroke-linecap="round"/>
  <g id="torso" transform="rotate(6 240 320)">
    <rect x="214" y="210" width="52" height="110" rx="18" fill="#FFFFFF" stroke="#22343B" stroke-width="3.0"/>
  </g>
  <g class="arm">
    <path d="M250,240 L296,286 L316,318" fill="none" stroke="#22343B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M250,240 L296,286 L316,318" fill="none" stroke="#F0DFC9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="318" cy="318" r="7" fill="#BC7085" stroke="#22343B" stroke-width="2"/>
  </g>
  <!-- rotation arrow at the pelvis -->
  <path d="M186,326 A34,34 0 0 1 214,300" fill="none" stroke="#BC7085" stroke-width="2.5" stroke-dasharray="6 5" opacity="0.75" stroke-linecap="round"/>
  <path d="M204,296 L216,299 L211,311" fill="none" stroke="#BC7085" stroke-width="2.5" opacity="0.75" stroke-linejoin="round"/>
  <g id="head" transform="rotate(6 240 320)">
    <circle cx="248" cy="155" r="34" fill="#F0DFC9" stroke="#22343B" stroke-width="3.0"/>
    <path d="M218,149 Q238,115 270,127 Q258,147 228,159 Z" fill="#22343B"/>
    <path d="M276,159 L286,164 L276,169 Z" fill="#F0DFC9" stroke="#22343B" stroke-width="2"/>
    <circle cx="252" cy="155" r="3" fill="#22343B"/>
    <path d="M254,169 Q262,173 270,167" fill="none" stroke="#22343B" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
