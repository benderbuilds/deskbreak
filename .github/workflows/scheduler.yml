name: Scheduler

# The one and only scheduler for DeskBreak's background jobs.
#
# Every 15 minutes it calls the push scheduler and the reminder mailer. Both
# endpoints are idempotent: each decides what is due in every profile's own
# time zone and records every send in `notification_deliveries`, so calling
# them early, late, twice, or after a missed run never produces a duplicate.
# Nothing here depends on the runner's clock.
#
# Vercel Cron is deliberately not configured (there is no vercel.json crons
# entry): the Hobby plan only allows daily jobs, and two schedulers for the
# same endpoints would be one too many. Do not enable both.
#
# Set two repository secrets: APP_URL (e.g. https://deskbreak.app) and
# CRON_SECRET (the same value the deployment has). Without them the runs skip.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: deskbreak-scheduler
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Push reminders
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET not set; skipping."
            exit 0
          fi
          curl -sS -f -X POST "$APP_URL/api/push/send" -H "Authorization: Bearer $CRON_SECRET"

      - name: Email reminders
        if: always()
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET not set; skipping."
            exit 0
          fi
          curl -sS -f -X POST "$APP_URL/api/reminders/send" -H "Authorization: Bearer $CRON_SECRET"
