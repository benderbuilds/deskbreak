name: Scheduler

# Triggers the push scheduler every 15 minutes and the reminder mailer hourly.
# Vercel Hobby only allows daily cron jobs, so the schedule lives here instead.
# Set two repository secrets: APP_URL (e.g. https://deskbreak.app) and
# CRON_SECRET (the same value the deployment has). Without them the runs skip.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Send due push reminders
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET not set; skipping."
            exit 0
          fi
          curl -sS -f -X POST "$APP_URL/api/push/send" -H "Authorization: Bearer $CRON_SECRET"

  email:
    runs-on: ubuntu-latest
    steps:
      - name: Send daily reminder emails (hourly, once per local afternoon)
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET not set; skipping."
            exit 0
          fi
          # The mailer itself picks recipients whose local time is 2 PM, so
          # calling it every 15 minutes is safe; keep it hourly to be polite.
          if [ "$(date -u +%M)" -lt 15 ]; then
            curl -sS -f -X POST "$APP_URL/api/reminders/send" -H "Authorization: Bearer $CRON_SECRET"
          else
            echo "Not the top of the hour; skipping email run."
          fi
