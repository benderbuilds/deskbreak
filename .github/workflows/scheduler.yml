name: Scheduler

# Manual fallback for DeskBreak's background jobs. Not the scheduler.
#
# The clock lives in an external cron service (cron-job.org) that POSTs
# /api/push/send every 5 minutes and /api/reminders/send every 15 minutes with
# `Authorization: Bearer $CRON_SECRET`. GitHub's `schedule` trigger was tried
# first and fired hours late on this repository, which is why it is gone.
#
# Both endpoints are idempotent: each decides what is due in every profile's
# own time zone and records every send in `notification_deliveries`, so
# running this by hand on top of the cron service never double-sends.
#
# Vercel Cron is deliberately not configured (there is no vercel.json crons
# entry): the Hobby plan only allows daily jobs. Keep exactly one driver.
#
# Needs two repository secrets: APP_URL (https://deskbreak.co) and
# CRON_SECRET (the same value the deployment has). Without them the run skips.
on:
  workflow_dispatch:

concurrency:
  group: deskbreak-scheduler
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Push reminders
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET not set; skipping."
            exit 0
          fi
          curl -sS -f -X POST "$APP_URL/api/push/send" -H "Authorization: Bearer $CRON_SECRET"

      - name: Email reminders
        if: always()
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET not set; skipping."
            exit 0
          fi
          curl -sS -f -X POST "$APP_URL/api/reminders/send" -H "Authorization: Bearer $CRON_SECRET"
