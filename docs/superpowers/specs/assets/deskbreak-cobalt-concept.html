}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;div id=&quot;deskbreak-design&quot; aria-label=&quot;DeskBreak color and homepage concept&quot;&gt;
  &lt;style&gt;
    @import url(&#x27;https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&amp;display=swap&#x27;);
    #deskbreak-design{--db-bg:#f7f9fc;--db-sheet:#fff;--db-ink:#18233d;--db-muted:#536078;--db-action:#3155d9;--db-soft:#edf0ff;--db-note:#ffe08a;--db-line:#dce2ec;--db-on-action:#fff;color-scheme:light dark;font-family:Archivo,Arial,sans-serif;color:var(--db-ink);background:transparent}
    #deskbreak-design *{box-sizing:border-box}
    #deskbreak-design button,#deskbreak-design a{font:inherit;-webkit-tap-highlight-color:transparent}
    #deskbreak-design .db-window{color-scheme:light;background:var(--db-bg);border:1px solid var(--db-line);border-radius:18px;overflow:hidden}
    #deskbreak-design .db-nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 32px;background:var(--db-sheet);border-bottom:1px solid var(--db-line)}
    #deskbreak-design .db-brand{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:800;letter-spacing:-.8px}
    #deskbreak-design .db-mark{display:grid;place-items:center;width:30px;height:30px;background:var(--db-action);color:var(--db-on-action);border-radius:9px;font-size:20px;transform:rotate(-7deg)}
    #deskbreak-design .db-nav-right{display:flex;gap:20px;align-items:center}
    #deskbreak-design .db-nav-right a{font-size:12px;font-weight:600;color:var(--db-muted);text-decoration:none}
    #deskbreak-design .db-nav-right .db-open{border:1px solid var(--db-line);padding:10px 14px;border-radius:10px;color:var(--db-ink)}
    #deskbreak-design .db-hero{display:grid;grid-template-columns:1.05fr 1fr;gap:36px;align-items:center;padding:52px 40px 42px}
    #deskbreak-design .db-copy h1{font-size:clamp(34px,5.2vw,54px);line-height:1.03;letter-spacing:-2px;font-weight:800;margin:0 0 19px;max-width:450px}
    #deskbreak-design .db-intro{font-size:16px;line-height:1.65;color:var(--db-muted);margin:0 0 24px;max-width:350px}
    #deskbreak-design .db-main-cta{display:inline-flex;align-items:center;justify-content:center;border:0;background:var(--db-action);color:var(--db-on-action);font-size:15px;font-weight:700;padding:17px 21px;border-radius:12px;text-decoration:none;min-height:52px;cursor:pointer}
    #deskbreak-design .db-trust{font-size:12px;line-height:1.6;color:var(--db-muted);margin:11px 0 0}
    #deskbreak-design .db-wink{display:inline-block;background:var(--db-note);color:var(--db-ink);font-size:12px;font-weight:600;line-height:1.4;padding:8px 11px;border-radius:5px 5px 12px 5px;margin-top:30px;transform:rotate(-2deg)}
    #deskbreak-design .db-wink[hidden]{display:none}
    #deskbreak-design .db-preview{background:var(--db-sheet);border:1px solid var(--db-line);border-radius:22px;padding:22px;box-shadow:0 18px 34px -28px #18233d60;position:relative}
    #deskbreak-design .db-preview-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;color:var(--db-muted);gap:8px}
    #deskbreak-design .db-preview-top span:last-child{background:var(--db-soft);color:var(--db-action);padding:5px 8px;border-radius:6px;font-size:11px}
    #deskbreak-design .db-art-field{margin:18px 0 15px;background:var(--db-soft);border-radius:14px;height:210px;display:grid;grid-template-columns:1fr auto;align-items:center;padding:0 22px 0 0;overflow:hidden}
    #deskbreak-design .db-art{height:210px;width:100%;object-fit:contain;display:block}
    #deskbreak-design .db-time{font-size:39px;font-weight:800;letter-spacing:-1.8px;color:var(--db-ink);font-variant-numeric:tabular-nums;line-height:1}
    #deskbreak-design .db-time-label{display:block;font-size:11px;font-weight:500;color:var(--db-muted);letter-spacing:0;margin-top:8px;text-align:center}
    #deskbreak-design .db-move{font-size:21px;font-weight:800;letter-spacing:-.5px;margin:0}
    #deskbreak-design .db-cue{font-size:13px;line-height:1.55;color:var(--db-muted);margin:8px 0 16px;min-height:41px}
    #deskbreak-design .db-preview-footer{display:flex;align-items:center;justify-content:space-between;gap:12px}
    #deskbreak-design .db-segments{display:flex;gap:4px;flex:1;max-width:135px}
    #deskbreak-design .db-segments span{height:4px;border-radius:3px;background:var(--db-line);flex:1}
    #deskbreak-design .db-segments span.db-active{background:var(--db-action)}
    #deskbreak-design .db-next{background:transparent;color:var(--db-action);font-size:12px;font-weight:700;border:1px solid var(--db-line);border-radius:9px;padding:11px;min-height:44px;cursor:pointer}
    #deskbreak-design .db-how{background:var(--db-sheet);border-top:1px solid var(--db-line);padding:25px 40px 30px}
    #deskbreak-design .db-how h2{font-size:20px;letter-spacing:-.5px;font-weight:800;margin:0 0 20px}
    #deskbreak-design .db-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
    #deskbreak-design .db-step{display:flex;align-items:flex-start;gap:10px}
    #deskbreak-design .db-number{font-size:13px;font-weight:700;background:var(--db-soft);color:var(--db-action);width:26px;height:26px;display:grid;place-items:center;flex-shrink:0;border-radius:8px}
    #deskbreak-design .db-step b{font-size:13px;line-height:1.5;font-weight:700}
    #deskbreak-design .db-step p{font-size:12px;line-height:1.55;color:var(--db-muted);margin:5px 0 0}
    #deskbreak-design .db-palette{display:flex;flex-wrap:wrap;align-items:center;gap:8px 17px;padding:17px 2px 0;font-size:11px;line-height:1.5}
    #deskbreak-design .db-palette-label{font-weight:600;color:light-dark(#18233d,#eff3ff);font-size:12px;flex-basis:100%}
    #deskbreak-design .db-swatch{display:flex;gap:6px;align-items:center;color:light-dark(#536078,#c4cada)}
    #deskbreak-design .db-dot{width:17px;height:17px;display:inline-block;border:1px solid #8692a580;border-radius:5px}
    #deskbreak-design .db-dialog{color-scheme:light;background:var(--db-sheet);color:var(--db-ink);border:1px solid var(--db-line);border-radius:18px;padding:25px;max-width:460px;width:calc(100% - 28px);box-shadow:0 24px 80px #18233d40}
    #deskbreak-design .db-dialog::backdrop{background:#18233d60}
    #deskbreak-design .db-dialog h2{margin:0 0 14px;font-size:24px;font-weight:800;letter-spacing:-.7px}
    #deskbreak-design .db-dialog p{font-size:14px;line-height:1.6;margin:0 0 18px}
    #deskbreak-design .db-dialog a{font-size:13px;color:var(--db-action);font-weight:600}
    #deskbreak-design .db-dialog-actions{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
    #deskbreak-design .db-close{background:transparent;border:0;color:var(--db-muted);padding:12px;cursor:pointer;font-size:13px}
    @media(max-width:650px){#deskbreak-design .db-nav{padding:16px 20px}#deskbreak-design .db-nav-right a:not(.db-open){display:none}#deskbreak-design .db-hero{grid-template-columns:1fr;padding:30px 22px;gap:26px}#deskbreak-design .db-copy h1{font-size:42px;max-width:340px}#deskbreak-design .db-intro{font-size:15px;max-width:100%;margin-bottom:19px}#deskbreak-design .db-main-cta{width:100%}#deskbreak-design .db-wink{margin-top:18px}#deskbreak-design .db-preview{padding:18px}#deskbreak-design .db-art-field{height:175px;margin-top:14px}#deskbreak-design .db-art{height:175px}#deskbreak-design .db-time{font-size:37px}#deskbreak-design .db-how{padding:25px 22px}#deskbreak-design .db-steps{grid-template-columns:1fr;gap:18px}#deskbreak-design .db-dialog-actions .db-main-cta{width:auto}#deskbreak-design .db-palette{gap:9px 13px}}
    @media(max-width:360px){#deskbreak-design .db-copy h1{font-size:37px}#deskbreak-design .db-brand{font-size:18px}#deskbreak-design .db-nav-right .db-open{padding:9px}#deskbreak-design .db-hero{padding:25px 17px}#deskbreak-design .db-time{font-size:30px}#deskbreak-design .db-art-field{padding-right:12px}}
