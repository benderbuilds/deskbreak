<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1190" viewBox="0 0 600 1190" role="img" aria-labelledby="title desc"><title id="title">The 20-20-20 reminder</title><desc id="desc">The mnemonic means every 20 minutes, look about 20 feet away, for 20 seconds. Twenty feet is about six metres.</desc><rect x="0" y="0" width="600" height="1190" rx="0" fill="#F7F9FC" stroke="none"/><rect x="0" y="0" width="12" height="1190" rx="0" fill="#3155D9" stroke="none"/><text x="36" y="58" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="800" fill="#3155D9">DeskBreak</text><text x="344.01599999999996" y="58" font-family="Archivo, Arial, sans-serif" font-size="24" font-weight="500" fill="#536078">A familiar mnemonic</text><text x="36" y="140" font-family="Archivo, Arial, sans-serif" font-size="43" font-weight="800" fill="#18233D">The 20-20-20 reminder</text><text x="36" y="256" font-family="Archivo, Arial, sans-serif" font-size="29" font-weight="500" fill="#536078">A prompt to look beyond the screen.</text><rect x="36" y="315" width="528" height="197" rx="18" fill="#FFFFFF" stroke="none"/><g transform="translate(59 358) scale(1.04)"><circle cx="50" cy="50" r="35" fill="none" stroke="#18233D" stroke-width="4"/><line x1="50" y1="50" x2="50" y2="25" stroke="#3155D9" stroke-width="5"  stroke-linecap="round"/><line x1="50" y1="50" x2="70" y2="61" stroke="#3155D9" stroke-width="5"  stroke-linecap="round"/><circle cx="50" cy="50" r="4" fill="#18233D" stroke="none" stroke-width="0"/></g><text x="197" y="360" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="500" fill="#536078">Every</text><text x="191" y="446" font-family="Archivo, Arial, sans-serif" font-size="100" font-weight="800" fill="#3155D9">20</text><text x="334" y="445" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="800" fill="#18233D">minutes</text><rect x="36" y="535" width="528" height="197" rx="18" fill="#EDF0FF" stroke="none"/><g transform="translate(59 578) scale(1.04)"><rect x="11" y="15" width="78" height="68" rx="6" fill="#FFFFFF" stroke="#18233D"/><line x1="50" y1="15" x2="50" y2="83" stroke="#18233D" stroke-width="3"  stroke-linecap="round"/><line x1="11" y1="49" x2="89" y2="49" stroke="#18233D" stroke-width="3"  stroke-linecap="round"/><circle cx="72" cy="32" r="9" fill="#FFE08A" stroke="none" stroke-width="0"/><path d="M17 74L33 59L46 71M56 71L65 62L83 77" fill="none" stroke="#3155D9" stroke-width="3"/></g><text x="197" y="580" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="500" fill="#536078">Look about</text><text x="191" y="666" font-family="Archivo, Arial, sans-serif" font-size="100" font-weight="800" fill="#3155D9">20</text><text x="334" y="665" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="800" fill="#18233D">feet away</text><text x="199" y="707" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="500" fill="#536078">about 6 metres</text><rect x="36" y="755" width="528" height="197" rx="18" fill="#FFFFFF" stroke="none"/><g transform="translate(59 798) scale(1.04)"><circle cx="50" cy="57" r="30" fill="none" stroke="#18233D" stroke-width="4"/><line x1="41" y1="13" x2="59" y2="13" stroke="#18233D" stroke-width="5"  stroke-linecap="round"/><line x1="50" y1="13" x2="50" y2="25" stroke="#18233D" stroke-width="4"  stroke-linecap="round"/><line x1="50" y1="57" x2="66" y2="40" stroke="#3155D9" stroke-width="5"  stroke-linecap="round"/><circle cx="50" cy="57" r="4" fill="#3155D9" stroke="none" stroke-width="0"/></g><text x="197" y="800" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="500" fill="#536078">For</text><text x="191" y="886" font-family="Archivo, Arial, sans-serif" font-size="100" font-weight="800" fill="#3155D9">20</text><text x="334" y="885" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="800" fill="#18233D">seconds</text><text x="36" y="1042" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="800" fill="#18233D">The study did not compare alternative</text><text x="36" y="1079.8" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="800" fill="#18233D">schedules.</text><line x1="36" y1="1102" x2="564" y2="1102" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><text x="36" y="1145" font-family="Archivo, Arial, sans-serif" font-size="22" font-weight="500" fill="#536078">Talens-Estarelles et al. (2023)</text><circle cx="557" cy="1142" r="7" fill="#FFE08A" stroke="none" stroke-width="0"/></svg>