<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc"><title id="title">The 20-20-20 reminder</title><desc id="desc">Every 20 minutes, look away from the screen at something about 20 feet away for 20 seconds. Twenty feet is about six meters.</desc><rect x="0" y="0" width="1200" height="830" rx="0" fill="#F7F9FC" stroke="none"/><rect x="0" y="0" width="12" height="830" rx="0" fill="#3155D9" stroke="none"/><text x="56" y="58" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="800" fill="#3155D9">DeskBreak</text><text x="1007.152" y="58" font-family="Archivo, Arial, sans-serif" font-size="24" font-weight="500" fill="#536078">How it works</text><text x="56" y="140" font-family="Archivo, Arial, sans-serif" font-size="58" font-weight="800" fill="#18233D">The 20-20-20 reminder</text><text x="56" y="217" font-family="Archivo, Arial, sans-serif" font-size="31" font-weight="500" fill="#536078">Look away from your screen.</text><rect x="56" y="265" width="344" height="338" rx="18" fill="#FFFFFF" stroke="none"/><g transform="translate(295 331) scale(0.72)"><circle cx="50" cy="50" r="35" fill="none" stroke="#18233D" stroke-width="4"/><line x1="50" y1="50" x2="50" y2="25" stroke="#3155D9" stroke-width="5"  stroke-linecap="round"/><line x1="50" y1="50" x2="70" y2="61" stroke="#3155D9" stroke-width="5"  stroke-linecap="round"/><circle cx="50" cy="50" r="4" fill="#18233D" stroke="none" stroke-width="0"/></g><text x="82" y="319" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="500" fill="#536078">Every</text><text x="79" y="470" font-family="Archivo, Arial, sans-serif" font-size="148" font-weight="800" fill="#3155D9">20</text><text x="84" y="535" font-family="Archivo, Arial, sans-serif" font-size="34" font-weight="800" fill="#18233D">minutes</text><rect x="427" y="265" width="344" height="338" rx="18" fill="#EDF0FF" stroke="none"/><g transform="translate(666 331) scale(0.72)"><rect x="11" y="15" width="78" height="68" rx="6" fill="#FFFFFF" stroke="#18233D"/><line x1="50" y1="15" x2="50" y2="83" stroke="#18233D" stroke-width="3"  stroke-linecap="round"/><line x1="11" y1="49" x2="89" y2="49" stroke="#18233D" stroke-width="3"  stroke-linecap="round"/><circle cx="72" cy="32" r="9" fill="#FFE08A" stroke="none" stroke-width="0"/><path d="M17 74L33 59L46 71M56 71L65 62L83 77" fill="none" stroke="#3155D9" stroke-width="3"/></g><text x="453" y="319" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="500" fill="#536078">Look at something</text><text x="450" y="470" font-family="Archivo, Arial, sans-serif" font-size="148" font-weight="800" fill="#3155D9">20</text><text x="455" y="535" font-family="Archivo, Arial, sans-serif" font-size="34" font-weight="800" fill="#18233D">feet away</text><text x="455" y="573" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="500" fill="#536078">about 6 meters</text><rect x="798" y="265" width="344" height="338" rx="18" fill="#FFFFFF" stroke="none"/><g transform="translate(1037 331) scale(0.72)"><circle cx="50" cy="57" r="30" fill="none" stroke="#18233D" stroke-width="4"/><line x1="41" y1="13" x2="59" y2="13" stroke="#18233D" stroke-width="5"  stroke-linecap="round"/><line x1="50" y1="13" x2="50" y2="25" stroke="#18233D" stroke-width="4"  stroke-linecap="round"/><line x1="50" y1="57" x2="66" y2="40" stroke="#3155D9" stroke-width="5"  stroke-linecap="round"/><circle cx="50" cy="57" r="4" fill="#3155D9" stroke="none" stroke-width="0"/></g><text x="824" y="319" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="500" fill="#536078">For</text><text x="821" y="470" font-family="Archivo, Arial, sans-serif" font-size="148" font-weight="800" fill="#3155D9">20</text><text x="826" y="535" font-family="Archivo, Arial, sans-serif" font-size="34" font-weight="800" fill="#18233D">seconds</text><text x="56" y="692" font-family="Archivo, Arial, sans-serif" font-size="31" font-weight="800" fill="#18233D">The study did not test other timings.</text><line x1="56" y1="742" x2="1144" y2="742" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><text x="56" y="785" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="500" fill="#536078">Talens-Estarelles et al. (2023)</text><circle cx="1137" cy="782" r="7" fill="#FFE08A" stroke="none" stroke-width="0"/></svg>