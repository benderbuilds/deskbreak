<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1270" viewBox="0 0 600 1270" role="img" aria-labelledby="title desc"><title id="title">What this walking study tells us</title><desc id="desc">The study tested walking breaks and blood sugar over a few hours in a lab. It did not test desk stretches or long-term health.</desc><rect x="0" y="0" width="600" height="1270" rx="0" fill="#F7F9FC" stroke="none"/><rect x="0" y="0" width="12" height="1270" rx="0" fill="#3155D9" stroke="none"/><text x="36" y="58" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="800" fill="#3155D9">DeskBreak</text><text x="410.88" y="58" font-family="Archivo, Arial, sans-serif" font-size="24" font-weight="500" fill="#536078">What it means</text><text x="36" y="140" font-family="Archivo, Arial, sans-serif" font-size="43" font-weight="800" fill="#18233D">What this walking study</text><text x="36" y="190" font-family="Archivo, Arial, sans-serif" font-size="43" font-weight="800" fill="#18233D">tells us</text><line x1="36" y1="486" x2="564" y2="486" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><rect x="36" y="282" width="128.3" height="46" rx="23" fill="#FFE08A" stroke="none"/><text x="52" y="314" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="800" fill="#18233D">Activity</text><text x="36" y="380" font-family="Archivo, Arial, sans-serif" font-size="29" font-weight="800" fill="#3155D9">Walking breaks</text><text x="36" y="435" font-family="Archivo, Arial, sans-serif" font-size="26" font-weight="500" fill="#536078">Did not test: desk stretches</text><line x1="36" y1="712" x2="564" y2="712" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><rect x="36" y="508" width="94.975" height="46" rx="23" fill="#FFE08A" stroke="none"/><text x="52" y="540" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="800" fill="#18233D">Time</text><text x="36" y="606" font-family="Archivo, Arial, sans-serif" font-size="29" font-weight="800" fill="#3155D9">A few hours in a lab</text><text x="36" y="661" font-family="Archivo, Arial, sans-serif" font-size="26" font-weight="500" fill="#536078">Did not test: months of desk work</text><line x1="36" y1="938" x2="564" y2="938" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><rect x="36" y="734" width="112.875" height="46" rx="23" fill="#FFE08A" stroke="none"/><text x="52" y="766" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="800" fill="#18233D">Result</text><text x="36" y="832" font-family="Archivo, Arial, sans-serif" font-size="29" font-weight="800" fill="#3155D9">Blood sugar and insulin</text><text x="36" y="887" font-family="Archivo, Arial, sans-serif" font-size="26" font-weight="500" fill="#536078">Did not test: long-term health</text><rect x="36" y="977" width="528" height="128" rx="12" fill="#FFE08A" stroke="none"/><text x="56" y="1020" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="800" fill="#18233D">It did not find the best break timing</text><text x="56" y="1057.8" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="800" fill="#18233D">for everyone.</text><line x1="36" y1="1182" x2="564" y2="1182" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><text x="36" y="1225" font-family="Archivo, Arial, sans-serif" font-size="22" font-weight="500" fill="#536078">Study context: Dunstan et al. (2012)</text><circle cx="557" cy="1222" r="7" fill="#FFE08A" stroke="none" stroke-width="0"/></svg>