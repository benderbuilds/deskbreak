<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1200" viewBox="0 0 600 1200" role="img" aria-labelledby="title desc"><title id="title">Keep the finding in context</title><desc id="desc">The experiment tested walking, short laboratory sessions, and blood markers. It did not test stretching, a universal schedule, or long-term health outcomes.</desc><rect x="0" y="0" width="600" height="1200" rx="0" fill="#F7F9FC" stroke="none"/><rect x="0" y="0" width="12" height="1200" rx="0" fill="#3155D9" stroke="none"/><text x="36" y="58" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="800" fill="#3155D9">DeskBreak</text><text x="373.368" y="58" font-family="Archivo, Arial, sans-serif" font-size="24" font-weight="500" fill="#536078">Reading research</text><text x="36" y="140" font-family="Archivo, Arial, sans-serif" font-size="43" font-weight="800" fill="#18233D">Keep the finding in</text><text x="36" y="190" font-family="Archivo, Arial, sans-serif" font-size="43" font-weight="800" fill="#18233D">context</text><line x1="36" y1="486" x2="564" y2="486" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><rect x="36" y="282" width="177.85" height="46" rx="23" fill="#FFE08A" stroke="none"/><text x="52" y="314" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="800" fill="#18233D">The activity</text><text x="36" y="380" font-family="Archivo, Arial, sans-serif" font-size="29" font-weight="800" fill="#3155D9">Walking breaks</text><text x="36" y="435" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="500" fill="#536078">Not a stretching routine</text><line x1="36" y1="712" x2="564" y2="712" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><rect x="36" y="508" width="172.725" height="46" rx="23" fill="#FFE08A" stroke="none"/><text x="52" y="540" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="800" fill="#18233D">The setting</text><text x="36" y="606" font-family="Archivo, Arial, sans-serif" font-size="29" font-weight="800" fill="#3155D9">Short laboratory sessions</text><text x="36" y="661" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="500" fill="#536078">Not months of desk work</text><line x1="36" y1="938" x2="564" y2="938" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><rect x="36" y="734" width="196.1" height="46" rx="23" fill="#FFE08A" stroke="none"/><text x="52" y="766" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="800" fill="#18233D">The outcome</text><text x="36" y="832" font-family="Archivo, Arial, sans-serif" font-size="29" font-weight="800" fill="#3155D9">Post-drink blood markers</text><text x="36" y="887" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="500" fill="#536078">Not long-term health</text><rect x="36" y="977" width="528" height="84" rx="12" fill="#FFE08A" stroke="none"/><text x="56" y="1020" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="800" fill="#18233D">An experiment is not a universal</text><text x="56" y="1057.8" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="800" fill="#18233D">schedule.</text><line x1="36" y1="1112" x2="564" y2="1112" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><text x="36" y="1155" font-family="Archivo, Arial, sans-serif" font-size="22" font-weight="500" fill="#536078">Study context: Dunstan et al. (2012)</text><circle cx="557" cy="1152" r="7" fill="#FFE08A" stroke="none" stroke-width="0"/></svg>