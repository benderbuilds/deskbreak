<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc"><title id="title">What this walking study tells us</title><desc id="desc">The study tested walking breaks and blood sugar over a few hours in a lab. It did not test desk stretches or long-term health.</desc><rect x="0" y="0" width="1200" height="880" rx="0" fill="#F7F9FC" stroke="none"/><rect x="0" y="0" width="12" height="880" rx="0" fill="#3155D9" stroke="none"/><text x="56" y="58" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="800" fill="#3155D9">DeskBreak</text><text x="990.88" y="58" font-family="Archivo, Arial, sans-serif" font-size="24" font-weight="500" fill="#536078">What it means</text><text x="56" y="140" font-family="Archivo, Arial, sans-serif" font-size="58" font-weight="800" fill="#18233D">What this walking study tells us</text><text x="306" y="240" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="800" fill="#3155D9">What it tested</text><text x="686" y="240" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="800" fill="#536078">What it did not test</text><line x1="56" y1="399" x2="1144" y2="399" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><text x="56" y="336" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#18233D">Activity</text><text x="306" y="320" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#3155D9">Walking breaks</text><text x="686" y="320" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="500" fill="#536078">Desk stretches</text><line x1="56" y1="539" x2="1144" y2="539" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><text x="56" y="476" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#18233D">Time</text><text x="306" y="460" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#3155D9">A few hours in a lab</text><text x="686" y="460" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="500" fill="#536078">Months of desk work</text><line x1="56" y1="679" x2="1144" y2="679" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><text x="56" y="616" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#18233D">Result</text><text x="306" y="600" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#3155D9">Blood sugar and</text><text x="306" y="640.5" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#3155D9">insulin</text><text x="686" y="600" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="500" fill="#536078">Long-term health</text><rect x="56" y="687" width="1088" height="62" rx="12" fill="#FFE08A" stroke="none"/><text x="76" y="730" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#18233D">It did not find the best break timing for everyone.</text><line x1="56" y1="792" x2="1144" y2="792" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><text x="56" y="835" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="500" fill="#536078">Study context: Dunstan et al. (2012)</text><circle cx="1137" cy="832" r="7" fill="#FFE08A" stroke="none" stroke-width="0"/></svg>