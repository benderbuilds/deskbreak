<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">Keep the finding in context</title><desc id="desc">The experiment tested walking, short laboratory sessions, and blood markers. It did not test stretching, a universal schedule, or long-term health outcomes.</desc><rect x="0" y="0" width="1200" height="850" rx="0" fill="#F7F9FC" stroke="none"/><rect x="0" y="0" width="12" height="850" rx="0" fill="#3155D9" stroke="none"/><text x="56" y="58" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="800" fill="#3155D9">DeskBreak</text><text x="953.3679999999999" y="58" font-family="Archivo, Arial, sans-serif" font-size="24" font-weight="500" fill="#536078">Reading research</text><text x="56" y="140" font-family="Archivo, Arial, sans-serif" font-size="58" font-weight="800" fill="#18233D">Keep the finding in context</text><text x="306" y="240" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="800" fill="#3155D9">What was tested</text><text x="686" y="240" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="800" fill="#536078">What it cannot establish</text><line x1="56" y1="399" x2="1144" y2="399" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><text x="56" y="336" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#18233D">The activity</text><text x="306" y="320" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#3155D9">Walking breaks</text><text x="686" y="320" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="500" fill="#536078">Not a stretching routine</text><line x1="56" y1="539" x2="1144" y2="539" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><text x="56" y="476" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#18233D">The setting</text><text x="306" y="460" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#3155D9">Short laboratory</text><text x="306" y="500.5" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#3155D9">sessions</text><text x="686" y="460" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="500" fill="#536078">Not months of desk work</text><line x1="56" y1="679" x2="1144" y2="679" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><text x="56" y="616" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#18233D">The outcome</text><text x="306" y="600" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#3155D9">Post-drink blood</text><text x="306" y="640.5" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#3155D9">markers</text><text x="686" y="600" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="500" fill="#536078">Not long-term health</text><rect x="56" y="687" width="1088" height="62" rx="12" fill="#FFE08A" stroke="none"/><text x="76" y="730" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#18233D">An experiment is not a universal schedule.</text><line x1="56" y1="762" x2="1144" y2="762" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><text x="56" y="805" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="500" fill="#536078">Study context: Dunstan et al. (2012)</text><circle cx="1137" cy="802" r="7" fill="#FFE08A" stroke="none" stroke-width="0"/></svg>