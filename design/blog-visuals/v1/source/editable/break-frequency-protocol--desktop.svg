<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc"><title id="title">A study of short walking breaks</title><desc id="desc">Nineteen adults each tried sitting without breaks, light walking breaks, and moderate walking breaks in a lab.</desc><rect x="0" y="0" width="1200" height="840" rx="0" fill="#F7F9FC" stroke="none"/><rect x="0" y="0" width="12" height="840" rx="0" fill="#3155D9" stroke="none"/><text x="56" y="58" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="800" fill="#3155D9">DeskBreak</text><text x="969.784" y="58" font-family="Archivo, Arial, sans-serif" font-size="24" font-weight="500" fill="#536078">What people did</text><text x="56" y="140" font-family="Archivo, Arial, sans-serif" font-size="58" font-weight="800" fill="#18233D">A study of short walking breaks</text><text x="56" y="223" font-family="Archivo, Arial, sans-serif" font-size="31" font-weight="500" fill="#536078">19 adults tried each of these three options.</text><rect x="56" y="273" width="1088" height="114" rx="16" fill="#FFFFFF" stroke="none"/><rect x="56" y="273" width="8" height="114" rx="4" fill="#DCE2EC" stroke="none"/><text x="84" y="320" font-family="Archivo, Arial, sans-serif" font-size="34" font-weight="800" fill="#18233D">Sitting without breaks</text><text x="84" y="358" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="500" fill="#536078">Stayed seated</text><rect x="56" y="408" width="1088" height="114" rx="16" fill="#FFFFFF" stroke="none"/><rect x="56" y="408" width="8" height="114" rx="4" fill="#3155D9" stroke="none"/><text x="84" y="455" font-family="Archivo, Arial, sans-serif" font-size="34" font-weight="800" fill="#18233D">Light walking breaks</text><text x="84" y="493" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="500" fill="#536078">Walked for 2 minutes every 20 minutes</text><rect x="56" y="543" width="1088" height="114" rx="16" fill="#FFFFFF" stroke="none"/><rect x="56" y="543" width="8" height="114" rx="4" fill="#18233D" stroke="none"/><text x="84" y="590" font-family="Archivo, Arial, sans-serif" font-size="34" font-weight="800" fill="#18233D">Moderate walking breaks</text><text x="84" y="628" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="500" fill="#536078">Walked for 2 minutes every 20 minutes</text><text x="56" y="727" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#18233D">Measured: blood sugar and insulin after a test drink.</text><line x1="56" y1="752" x2="1144" y2="752" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><text x="56" y="795" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="500" fill="#536078">Dunstan et al. (2012), Diabetes Care</text><circle cx="1137" cy="792" r="7" fill="#FFE08A" stroke="none" stroke-width="0"/></svg>