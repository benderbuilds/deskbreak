<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1360" viewBox="0 0 600 1360" role="img" aria-labelledby="title desc"><title id="title">What one small study tested</title><desc id="desc">Twenty-nine symptomatic computer users were monitored for two weeks without reminders, two weeks with reminders, and one week after reminders stopped.</desc><rect x="0" y="0" width="600" height="1360" rx="0" fill="#F7F9FC" stroke="none"/><rect x="0" y="0" width="12" height="1360" rx="0" fill="#3155D9" stroke="none"/><text x="36" y="58" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="800" fill="#3155D9">DeskBreak</text><text x="422.688" y="58" font-family="Archivo, Arial, sans-serif" font-size="24" font-weight="500" fill="#536078">Study design</text><text x="36" y="140" font-family="Archivo, Arial, sans-serif" font-size="43" font-weight="800" fill="#18233D">What one small study</text><text x="36" y="190" font-family="Archivo, Arial, sans-serif" font-size="43" font-weight="800" fill="#18233D">tested</text><rect x="36" y="286" width="416.96" height="46" rx="23" fill="#FFE08A" stroke="none"/><text x="52" y="318" font-family="Archivo, Arial, sans-serif" font-size="24" font-weight="800" fill="#18233D">29 symptomatic computer users</text><rect x="36" y="372" width="528" height="158" rx="16" fill="#FFFFFF" stroke="none"/><rect x="36" y="372" width="528" height="9" rx="3" fill="#DCE2EC" stroke="none"/><text x="60" y="419" font-family="Archivo, Arial, sans-serif" font-size="35" font-weight="800" fill="#18233D">2 weeks</text><text x="60" y="466" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="800" fill="#18233D">Baseline monitoring</text><text x="60" y="506" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="500" fill="#536078">No reminders</text><rect x="36" y="556" width="528" height="158" rx="16" fill="#FFFFFF" stroke="none"/><rect x="36" y="556" width="528" height="9" rx="3" fill="#3155D9" stroke="none"/><text x="60" y="603" font-family="Archivo, Arial, sans-serif" font-size="35" font-weight="800" fill="#3155D9">2 weeks</text><text x="60" y="650" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="800" fill="#18233D">20-20-20 reminders</text><text x="60" y="690" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="500" fill="#536078">Software prompts</text><rect x="36" y="740" width="528" height="158" rx="16" fill="#FFFFFF" stroke="none"/><rect x="36" y="740" width="528" height="9" rx="3" fill="#18233D" stroke="none"/><text x="60" y="787" font-family="Archivo, Arial, sans-serif" font-size="35" font-weight="800" fill="#18233D">1 week</text><text x="60" y="834" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="800" fill="#18233D">After reminders stopped</text><text x="60" y="874" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="500" fill="#536078">Follow-up</text><text x="36" y="984" font-family="Archivo, Arial, sans-serif" font-size="29" font-weight="800" fill="#3155D9">Reported symptoms improved</text><text x="36" y="1023.15" font-family="Archivo, Arial, sans-serif" font-size="29" font-weight="800" fill="#3155D9">during reminders.</text><text x="36" y="1086" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="500" fill="#18233D">Improvement was not clearly sustained</text><text x="36" y="1123.8" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="500" fill="#18233D">after stopping.</text><text x="36" y="1178" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="500" fill="#536078">Same people before and after. No separate</text><text x="36" y="1211.75" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="500" fill="#536078">control group.</text><line x1="36" y1="1272" x2="564" y2="1272" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><text x="36" y="1315" font-family="Archivo, Arial, sans-serif" font-size="22" font-weight="500" fill="#536078">Talens-Estarelles et al. (2023)</text><circle cx="557" cy="1312" r="7" fill="#FFE08A" stroke="none" stroke-width="0"/></svg>