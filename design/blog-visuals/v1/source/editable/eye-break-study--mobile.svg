<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1390" viewBox="0 0 600 1390" role="img" aria-labelledby="title desc"><title id="title">Eye breaks: what one study found</title><desc id="desc">Twenty-nine computer users with eye strain spent two weeks without reminders, two weeks with reminders, and one week after reminders stopped.</desc><rect x="0" y="0" width="600" height="1390" rx="0" fill="#F7F9FC" stroke="none"/><rect x="0" y="0" width="12" height="1390" rx="0" fill="#3155D9" stroke="none"/><text x="36" y="58" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="800" fill="#3155D9">DeskBreak</text><text x="390.528" y="58" font-family="Archivo, Arial, sans-serif" font-size="24" font-weight="500" fill="#536078">One small study</text><text x="36" y="140" font-family="Archivo, Arial, sans-serif" font-size="43" font-weight="800" fill="#18233D">Eye breaks: what one</text><text x="36" y="190" font-family="Archivo, Arial, sans-serif" font-size="43" font-weight="800" fill="#18233D">study found</text><rect x="36" y="286" width="433.088" height="46" rx="23" fill="#FFE08A" stroke="none"/><text x="52" y="318" font-family="Archivo, Arial, sans-serif" font-size="24" font-weight="800" fill="#18233D">29 computer users with eye strain</text><rect x="36" y="372" width="528" height="158" rx="16" fill="#FFFFFF" stroke="none"/><rect x="36" y="372" width="528" height="9" rx="3" fill="#DCE2EC" stroke="none"/><text x="60" y="419" font-family="Archivo, Arial, sans-serif" font-size="35" font-weight="800" fill="#18233D">2 weeks</text><text x="60" y="466" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="800" fill="#18233D">Before reminders</text><text x="60" y="506" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="500" fill="#536078">No prompts yet</text><rect x="36" y="556" width="528" height="158" rx="16" fill="#FFFFFF" stroke="none"/><rect x="36" y="556" width="528" height="9" rx="3" fill="#3155D9" stroke="none"/><text x="60" y="603" font-family="Archivo, Arial, sans-serif" font-size="35" font-weight="800" fill="#3155D9">2 weeks</text><text x="60" y="650" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="800" fill="#18233D">With reminders</text><text x="60" y="690" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="500" fill="#536078">20-20-20 prompts</text><rect x="36" y="740" width="528" height="158" rx="16" fill="#FFFFFF" stroke="none"/><rect x="36" y="740" width="528" height="9" rx="3" fill="#18233D" stroke="none"/><text x="60" y="787" font-family="Archivo, Arial, sans-serif" font-size="35" font-weight="800" fill="#18233D">1 week</text><text x="60" y="834" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="800" fill="#18233D">Reminders stopped</text><text x="60" y="874" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="500" fill="#536078">Checked again</text><text x="36" y="984" font-family="Archivo, Arial, sans-serif" font-size="29" font-weight="800" fill="#3155D9">People reported less eye strain</text><text x="36" y="1023.15" font-family="Archivo, Arial, sans-serif" font-size="29" font-weight="800" fill="#3155D9">during reminders.</text><text x="36" y="1086" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="500" fill="#18233D">It is unclear if the improvement lasted after</text><text x="36" y="1123.8" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="500" fill="#18233D">reminders stopped.</text><text x="36" y="1230" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="500" fill="#536078">Everyone followed the same sequence. No</text><text x="36" y="1263.75" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="500" fill="#536078">separate comparison group.</text><line x1="36" y1="1302" x2="564" y2="1302" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><text x="36" y="1345" font-family="Archivo, Arial, sans-serif" font-size="22" font-weight="500" fill="#536078">Talens-Estarelles et al. (2023)</text><circle cx="557" cy="1342" r="7" fill="#FFE08A" stroke="none" stroke-width="0"/></svg>