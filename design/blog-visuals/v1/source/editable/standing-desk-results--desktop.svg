<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc"><title id="title">How much less did people sit?</title><desc id="desc">After 12 months, people receiving support sat an estimated 22.2 minutes less per day than those with usual work habits. Support plus a desk: 63.7 minutes less.</desc><rect x="0" y="0" width="1200" height="1020" rx="0" fill="#F7F9FC" stroke="none"/><rect x="0" y="0" width="12" height="1020" rx="0" fill="#3155D9" stroke="none"/><text x="56" y="58" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="800" fill="#3155D9">DeskBreak</text><text x="973.144" y="58" font-family="Archivo, Arial, sans-serif" font-size="24" font-weight="500" fill="#536078">After 12 months</text><text x="56" y="140" font-family="Archivo, Arial, sans-serif" font-size="58" font-weight="800" fill="#18233D">How much less did people sit?</text><text x="56" y="224" font-family="Archivo, Arial, sans-serif" font-size="32" font-weight="800" fill="#18233D">Fewer minutes of sitting each day</text><text x="56" y="270" font-family="Archivo, Arial, sans-serif" font-size="29" font-weight="500" fill="#536078">Compared with usual work habits</text><line x1="384" y1="309" x2="384" y2="658" stroke="#536078" stroke-width="3"  stroke-linecap="round"/><text x="376.538" y="701" font-family="Archivo, Arial, sans-serif" font-size="26" font-weight="500" fill="#536078">0</text><line x1="505.3333333333333" y1="309" x2="505.3333333333333" y2="658" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><text x="490.7733333333333" y="701" font-family="Archivo, Arial, sans-serif" font-size="26" font-weight="500" fill="#536078">15</text><line x1="626.6666666666666" y1="309" x2="626.6666666666666" y2="658" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><text x="611.7296666666666" y="701" font-family="Archivo, Arial, sans-serif" font-size="26" font-weight="500" fill="#536078">30</text><line x1="748" 