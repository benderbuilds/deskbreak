<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1320" viewBox="0 0 600 1320" role="img" aria-labelledby="title desc"><title id="title">The study tested desks with support</title><desc id="desc">The trial compared usual work habits, support to sit less, and the same support plus an adjustable desk in 756 UK office workers.</desc><rect x="0" y="0" width="600" height="1320" rx="0" fill="#F7F9FC" stroke="none"/><rect x="0" y="0" width="12" height="1320" rx="0" fill="#3155D9" stroke="none"/><text x="36" y="58" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="800" fill="#3155D9">DeskBreak</text><text x="419.976" y="58" font-family="Archivo, Arial, sans-serif" font-size="24" font-weight="500" fill="#536078">Three groups</text><text x="36" y="140" font-family="Archivo, Arial, sans-serif" font-size="43" font-weight="800" fill="#18233D">The study tested desks</text><text x="36" y="190" font-family="Archivo, Arial, sans-serif" font-size="43" font-weight="800" fill="#18233D">with support</text><text x="36" y="279" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="500" fill="#536078">756 UK office workers in 78 workplace</text><text x="36" y="316.8" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="500" fill="#536078">groups.</text><rect x="36" y="357" width="528" height="190" rx="18" fill="#FFFFFF" stroke="none"/><g transform="translate(58 407) scale(0.94)"><circle cx="34" cy="29" r="12" fill="#FFE08A" stroke="#18233D" stroke-width="3"/><circle cx="70" cy="33" r="10" fill="#EDF0FF" stroke="#18233D" stroke-width="3"/><path d="M12 81V65Q12 48 34 48Q56 48 56 65V81M62 55Q89 55 89 71V81" fill="none" stroke="#18233D" stroke-width="4" stroke-linecap="round"/></g><text x="175" y="412" font-family="Archivo, Arial, sans-serif" font-size="32" font-weight="800" fill="#18233D">Usual work habits</text><text x="175" y="481" font-family="Archivo, Arial, sans-serif" font-size="26" font-weight="500" fill="#536078">No sit-less program</text><rect x="36" y="573" width="528" height="190" rx="18" fill="#FFFFFF" stroke="none"/><g transform="translate(58 623) scale(0.94)"><rect x="20" y="12" width="60" height="78" rx="6" fill="#FFFFFF" stroke="#18233D"/><rect x="35" y="6" width="30" height="15" rx="4" fill="#FFE08A" stroke="none"/><line x1="41" y1="37" x2="65" y2="37" stroke="#18233D" stroke-width="3"  stroke-linecap="round"/><line x1="41" y1="56" x2="65" y2="56" stroke="#18233D" stroke-width="3"  stroke-linecap="round"/><line x1="41" y1="75" x2="65" y2="75" stroke="#18233D" stroke-width="3"  stroke-linecap="round"/><circle cx="31" cy="37" r="4" fill="#3155D9" stroke="none" stroke-width="0"/><circle cx="31" cy="56" r="4" fill="#3155D9" stroke="none" stroke-width="0"/><circle cx="31" cy="75" r="4" fill="#3155D9" stroke="none" stroke-width="0"/></g><text x="175" y="628" font-family="Archivo, Arial, sans-serif" font-size="32" font-weight="800" fill="#18233D">Support to sit less</text><text x="175" y="697" font-family="Archivo, Arial, sans-serif" font-size="26" font-weight="500" fill="#536078">Education, goals and</text><text x="175" y="732.1" font-family="Archivo, Arial, sans-serif" font-size="26" font-weight="500" fill="#536078">reminders</text><rect x="36" y="789" width="528" height="190" rx="18" fill="#EDF0FF" stroke="none"/><g transform="translate(58 839) scale(0.94)"><rect x="33" y="14" width="40" height="27" rx="3" fill="#EDF0FF" stroke="#18233D"/><line x1="53" y1="41" x2="53" y2="48" stroke="#18233D" stroke-width="3"  stroke-linecap="round"/><line x1="19" y1="52" x2="89" y2="52" stroke="#3155D9" stroke-width="5"  stroke-linecap="round"/><line x1="25" y1="54" x2="25" y2="90" stroke="#18233D" stroke-width="4"  stroke-linecap="round"/><line x1="83" y1="54" x2="83" y2="90" stroke="#18233D" stroke-width="4"  stroke-linecap="round"/><line x1="35" y1="48" x2="71" y2="48" stroke="#18233D" stroke-width="3"  stroke-linecap="round"/></g><text x="175" y="844" font-family="Archivo, Arial, sans-serif" font-size="32" font-weight="800" fill="#18233D">Support + desk</text><text x="175" y="913" font-family="Archivo, Arial, sans-serif" font-size="26" font-weight="500" fill="#536078">Same support, plus an</text><text x="175" y="948.1" font-family="Archivo, Arial, sans-serif" font-size="26" font-weight="500" fill="#536078">adjustable desk</text><rect x="36" y="1040" width="388.184" height="46" rx="23" fill="#FFE08A" stroke="none"/><text x="52" y="1072" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="800" fill="#18233D">Compared after 12 months</text><text x="36" y="1147" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#18233D">No group received only a desk.</text><line x1="36" y1="1232" x2="564" y2="1232" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><text x="36" y="1275" font-family="Archivo, Arial, sans-serif" font-size="22" font-weight="500" fill="#536078">Edwardson et al. (2022), BMJ</text><circle cx="557" cy="1272" r="7" fill="#FFE08A" stroke="none" stroke-width="0"/></svg>