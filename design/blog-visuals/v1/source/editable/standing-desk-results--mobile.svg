<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1240" viewBox="0 0 600 1240" role="img" aria-labelledby="title desc"><title id="title">How much less did people sit?</title><desc id="desc">After 12 months, people receiving support sat an estimated 22.2 minutes less per day than those with usual work habits. Support plus a desk: 63.7 minutes less.</desc><rect x="0" y="0" width="600" height="1240" rx="0" fill="#F7F9FC" stroke="none"/><rect x="0" y="0" width="12" height="1240" rx="0" fill="#3155D9" stroke="none"/><text x="36" y="58" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="800" fill="#3155D9">DeskBreak</text><text x="393.144" y="58" font-family="Archivo, Arial, sans-serif" font-size="24" font-weight="500" fill="#536078">After 12 months</text><text x="36" y="140" font-family="Archivo, Arial, sans-serif" font-size="43" font-weight="800" fill="#18233D">How much less did</text><text x="36" y="190" font-family="Archivo, Arial, sans-serif" font-size="43" font-weight="800" fill="#18233D">people sit?</text><text x="36" y="275" font-family="Archivo, Arial, sans-serif" font-size="29" font-weight="800" fill="#18233D">Fewer minutes of sitting each day</text><text x="36" y="323" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="500" fill="#536078">Compared with usual work habits</text><line x1="60" y1="445" x2="60" y2="796" stroke="#536078" stroke-width="3"  stroke-linecap="round"/><text x="52.825" y="839" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="500" fill="#536078">0</text><line x1="141.33333333333331" y1="445" x2="141.33333333333331" y2="796" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><text x="127.33333333333331" y="839" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="500" fill="#536078">15</text><line x1="222.66666666666666" y1="445" x2="222.66666666666666" y2="796" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><text x="208.30416666666665" y="839" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="500" fill="#536078">30</text><line x1="304" y1="445" x2="304" y2="796" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><text x="289.7625" y="839" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="500" fill="#536078">45</text><line x1="385.3333333333333" y1="445" x2="385.3333333333333" y2="796" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><text x="370.9708333333333" y="839" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="500" fill="#536078">60</text><line x1="466.6666666666667" y1="445" x2="466.6666666666667" y2="796" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><text x="452.4541666666667" y="839" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="500" fill="#536078">75</text><line x1="548" y1="445" x2="548" y2="796" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><text x="533.65" y="839" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="500" fill="#536078">90</text><text x="36" y="417" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#18233D">Support to sit less</text><text x="436.92" y="417" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#18233D">22.2 min</text><line x1="90.90666666666667" y1="493" x2="270.3822222222222" y2="493" stroke="#18233D" stroke-width="8"  stroke-linecap="round"/><line x1="90.90666666666667" y1="477" x2="90.90666666666667" y2="509" stroke="#18233D" stroke-width="4"  stroke-linecap="round"/><line x1="270.3822222222222" y1="477" x2="270.3822222222222" y2="509" stroke="#18233D" stroke-width="4"  stroke-linecap="round"/><circle cx="180.37333333333333" cy="493" r="14" fill="#18233D" stroke="none" stroke-width="0"/><circle cx="180.37333333333333" cy="493" r="5" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="36" y="555" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="500" fill="#536078">Range: 5.7 to 38.8</text><text x="36" y="667" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#3155D9">Support + desk</text><text x="436.92" y="667" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#3155D9">63.7 min</text><line x1="317.0133333333333" y1="743" x2="494.31999999999994" y2="743" stroke="#3155D9" stroke-width="8"  stroke-linecap="round"/><line x1="317.0133333333333" y1="727" x2="317.0133333333333" y2="759" stroke="#3155D9" stroke-width="4"  stroke-linecap="round"/><line x1="494.31999999999994" y1="727" x2="494.31999999999994" y2="759" stroke="#3155D9" stroke-width="4"  stroke-linecap="round"/><circle cx="405.3955555555556" cy="743" r="14" fill="#3155D9" stroke="none" stroke-width="0"/><circle cx="405.3955555555556" cy="743" r="5" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="36" y="805" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="500" fill="#536078">Range: 47.4 to 80.1</text><text x="36" y="916" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="500" fill="#536078">Dots = estimates. Bars = uncertainty.</text><text x="36" y="999" font-family="Archivo, Arial, sans-serif" font-size="26" font-weight="500" fill="#536078">Ranges are 95% confidence intervals.</text><text x="36" y="1078" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="800" fill="#18233D">Includes sitting at work and outside</text><text x="36" y="1115.8" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="800" fill="#18233D">work.</text><line x1="36" y1="1152" x2="564" y2="1152" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><text x="36" y="1195" font-family="Archivo, Arial, sans-serif" font-size="22" font-weight="500" fill="#536078">Edwardson et al. (2022), BMJ, Table 2</text><circle cx="557" cy="1192" r="7" fill="#FFE08A" stroke="none" stroke-width="0"/></svg>