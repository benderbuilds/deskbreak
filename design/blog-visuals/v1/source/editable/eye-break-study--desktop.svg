<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc"><title id="title">What one small study tested</title><desc id="desc">Twenty-nine symptomatic computer users were monitored for two weeks without reminders, two weeks with reminders, and one week after reminders stopped.</desc><rect x="0" y="0" width="1200" height="950" rx="0" fill="#F7F9FC" stroke="none"/><rect x="0" y="0" width="12" height="950" rx="0" fill="#3155D9" stroke="none"/><text x="56" y="58" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="800" fill="#3155D9">DeskBreak</text><text x="1002.688" y="58" font-family="Archivo, Arial, sans-serif" font-size="24" font-weight="500" fill="#536078">Study design</text><text x="56" y="140" font-family="Archivo, Arial, sans-serif" font-size="58" font-weight="800" fill="#18233D">What one small study tested</text><rect x="56" y="208" width="481.12" height="46" rx="23" fill="#FFE08A" stroke="none"/><text x="72" y="240" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="800" fill="#18233D">29 symptomatic computer users</text><rect x="56" y="302" width="344" height="271" rx="16" fill="#FFFFFF" stroke="none"/><rect x="56" y="302" width="344" height="9" rx="3" fill="#DCE2EC" stroke="none"/><text x="80" y="375" font-family="Archivo, Arial, sans-serif" font-size="49" font-weight="800" fill="#18233D">2 weeks</text><text x="80" y="440" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#18233D">Baseline</text><text x="80" y="480.5" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#18233D">monitoring</text><text x="80" y="539" font-family="Archivo, Arial, sans-serif" font-size="26" font-weight="500" fill="#536078">No reminders</text><rect x="427" y="302" width="344" height="271" rx="16" fill="#FFFFFF" stroke="none"/><rect x="427" y="302" width="344" height="9" rx="3" fill="#3155D9" stroke="none"/><text x="451" y="375" font-family="Archivo, Arial, sans-serif" font-size="49" font-weight="800" fill="#3155D9">2 weeks</text><text x="451" y="440" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#18233D">20-20-20</text><text x="451" y="480.5" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#18233D">reminders</text><text x="451" y="539" font-family="Archivo, Arial, sans-serif" font-size="26" font-weight="500" fill="#536078">Software prompts</text><rect x="798" y="302" width="344" height="271" rx="16" fill="#FFFFFF" stroke="none"/><rect x="798" y="302" width="344" height="9" rx="3" fill="#18233D" stroke="none"/><text x="822" y="375" font-family="Archivo, Arial, sans-serif" font-size="49" font-weight="800" fill="#18233D">1 week</text><text x="822" y="440" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#18233D">After reminders</text><text x="822" y="480.5" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#18233D">stopped</text><text x="822" y="539" font-family="Archivo, Arial, sans-serif" font-size="26" font-weight="500" fill="#536078">Follow-up</text><text x="56" y="653" font-family="Archivo, Arial, sans-serif" font-size="32" font-weight="800" fill="#3155D9">Reported symptoms improved during reminders.</text><text x="56" y="719" font-family="Archivo, Arial, sans-serif" font-size="31" font-weight="500" fill="#18233D">Improvement was not clearly sustained after stopping.</text><text x="56" y="826" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="500" fill="#536078">Same people before and after. No separate control group.</text><line x1="56" y1="862" x2="1144" y2="862" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><text x="56" y="905" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="500" fill="#536078">Talens-Estarelles et al. (2023)</text><circle cx="1137" cy="902" r="7" fill="#FFE08A" stroke="none" stroke-width="0"/></svg>