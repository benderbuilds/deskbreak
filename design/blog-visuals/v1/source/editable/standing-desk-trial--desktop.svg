<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">A desk was part of a programme</title><desc id="desc">A trial randomized 78 workplace clusters with 756 UK employees to usual practice, a sit-less programme, or the same programme plus a height-adjustable desk.</desc><rect x="0" y="0" width="1200" height="920" rx="0" fill="#F7F9FC" stroke="none"/><rect x="0" y="0" width="12" height="920" rx="0" fill="#3155D9" stroke="none"/><text x="56" y="58" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="800" fill="#3155D9">DeskBreak</text><text x="1002.688" y="58" font-family="Archivo, Arial, sans-serif" font-size="24" font-weight="500" fill="#536078">Study design</text><text x="56" y="140" font-family="Archivo, Arial, sans-serif" font-size="58" font-weight="800" fill="#18233D">A desk was part of a programme</text><text x="56" y="230" font-family="Archivo, Arial, sans-serif" font-size="31" font-weight="500" fill="#536078">756 UK employees. 78 workplace clusters.</text><rect x="56" y="290" width="344" height="335" rx="18" fill="#FFFFFF" stroke="none"/><g transform="translate(80 312) scale(1.02)"><circle cx="34" cy="29" r="12" fill="#FFE08A" stroke="#18233D" stroke-width="3"/><circle cx="70" cy="33" r="10" fill="#EDF0FF" stroke="#18233D" stroke-width="3"/><path d="M12 81V65Q12 48 34 48Q56 48 56 65V81M62 55Q89 55 89 71V81" fill="none" stroke="#18233D" stroke-width="4" stroke-linecap="round"/></g><text x="80" y="471" font-family="Archivo, Arial, sans-serif" font-size="34" font-weight="800" fill="#18233D">Usual practice</text><text x="80" y="558" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="500" fill="#536078">Control group</text><rect x="427" y="290" width="344" height="335" rx="18" fill="#FFFFFF" stroke="none"/><g transform="translate(451 312) scale(1.02)"><rect x="20" y="12" width="60" height="78" rx="6" fill="#FFFFFF" stroke="#18233D"/><rect x="35" y="6" width="30" height="15" rx="4" fill="#FFE08A" stroke="none"/><line x1="41" y1="37" x2="65" y2="37" stroke="#18233D" stroke-width="3"  stroke-linecap="round"/><line x1="41" y1="56" x2="65" y2="56" stroke="#18233D" stroke-width="3"  stroke-linecap="round"/><line x1="41" y1="75" x2="65" y2="75" stroke="#18233D" stroke-width="3"  stroke-linecap="round"/><circle cx="31" cy="37" r="4" fill="#3155D9" stroke="none" stroke-width="0"/><circle cx="31" cy="56" r="4" fill="#3155D9" stroke="none" stroke-width="0"/><circle cx="31" cy="75" r="4" fill="#3155D9" stroke="none" stroke-width="0"/></g><text x="451" y="471" font-family="Archivo, Arial, sans-serif" font-size="34" font-weight="800" fill="#18233D">Sit-less</text><text x="451" y="516.9" font-family="Archivo, Arial, sans-serif" font-size="34" font-weight="800" fill="#18233D">programme</text><text x="451" y="558" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="500" fill="#536078">SMART Work and Life</text><rect x="798" y="290" width="344" height="335" rx="18" fill="#EDF0FF" stroke="none"/><g transform="translate(822 312) scale(1.02)"><rect x="33" y="14" width="40" height="27" rx="3" fill="#EDF0FF" stroke="#18233D"/><line x1="53" y1="41" x2="53" y2="48" stroke="#18233D" stroke-width="3"  stroke-linecap="round"/><line x1="19" y1="52" x2="89" y2="52" stroke="#3155D9" stroke-width="5"  stroke-linecap="round"/><line x1="25" y1="54" x2="25" y2="90" stroke="#18233D" stroke-width="4"  stroke-linecap="round"/><line x1="83" y1="54" x2="83" y2="90" stroke="#18233D" stroke-width="4"  stroke-linecap="round"/><line x1="35" y1="48" x2="71" y2="48" stroke="#18233D" stroke-width="3"  stroke-linecap="round"/></g><text x="822" y="471" font-family="Archivo, Arial, sans-serif" font-size="34" font-weight="800" fill="#18233D">Programme +</text><text x="822" y="516.9" font-family="Archivo, Arial, sans-serif" font-size="34" font-weight="800" fill="#18233D">desk</text><text x="822" y="558" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="500" fill="#536078">Same support, plus an</text><text x="822" y="594.45" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="500" fill="#536078">adjustable desk</text><rect x="56" y="688" width="387.02" height="46" rx="23" fill="#FFE08A" stroke="none"/><text x="72" y="720" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#18233D">Compared at 12 months</text><text x="56" y="798" font-family="Archivo, Arial, sans-serif" font-size="35" font-weight="800" fill="#18233D">There was no desk-only group.</text><line x1="56" y1="832" x2="1144" y2="832" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><text x="56" y="875" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="500" fill="#536078">Edwardson et al. (2022), BMJ</text><circle cx="1137" cy="872" r="7" fill="#FFE08A" stroke="none" stroke-width="0"/></svg>