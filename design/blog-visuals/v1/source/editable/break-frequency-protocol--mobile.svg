<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1120" viewBox="0 0 600 1120" role="img" aria-labelledby="title desc"><title id="title">A walking-break experiment</title><desc id="desc">The same 19 adults completed three laboratory conditions: uninterrupted sitting, light walking breaks, and moderate walking breaks.</desc><rect x="0" y="0" width="600" height="1120" rx="0" fill="#F7F9FC" stroke="none"/><rect x="0" y="0" width="12" height="1120" rx="0" fill="#3155D9" stroke="none"/><text x="36" y="58" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="800" fill="#3155D9">DeskBreak</text><text x="422.688" y="58" font-family="Archivo, Arial, sans-serif" font-size="24" font-weight="500" fill="#536078">Study design</text><text x="36" y="140" font-family="Archivo, Arial, sans-serif" font-size="43" font-weight="800" fill="#18233D">A walking-break</text><text x="36" y="190" font-family="Archivo, Arial, sans-serif" font-size="43" font-weight="800" fill="#18233D">experiment</text><text x="36" y="267" font-family="Archivo, Arial, sans-serif" font-size="29" font-weight="500" fill="#536078">The same 19 adults tried all three</text><text x="36" y="306.15" font-family="Archivo, Arial, sans-serif" font-size="29" font-weight="500" fill="#536078">conditions.</text><rect x="36" y="322" width="528" height="174" rx="16" fill="#FFFFFF" stroke="none"/><rect x="36" y="322" width="8" height="174" rx="4" fill="#DCE2EC" stroke="none"/><text x="64" y="369" font-family="Archivo, Arial, sans-serif" font-size="32" font-weight="800" fill="#18233D">Uninterrupted sitting</text><text x="64" y="414" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="500" fill="#536078">No scheduled walking breaks</text><rect x="36" y="520" width="528" height="174" rx="16" fill="#FFFFFF" stroke="none"/><rect x="36" y="520" width="8" height="174" rx="4" fill="#3155D9" stroke="none"/><text x="64" y="567" font-family="Archivo, Arial, sans-serif" font-size="32" font-weight="800" fill="#18233D">Light walking</text><text x="64" y="612" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="500" fill="#536078">2-minute walk every 20 minutes</text><rect x="36" y="718" width="528" height="174" rx="16" fill="#FFFFFF" stroke="none"/><rect x="36" y="718" width="8" height="174" rx="4" fill="#18233D" stroke="none"/><text x="64" y="765" font-family="Archivo, Arial, sans-serif" font-size="32" font-weight="800" fill="#18233D">Moderate walking</text><text x="64" y="810" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="500" fill="#536078">2-minute walk every 20 minutes</text><text x="36" y="955" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="800" fill="#18233D">Measured: glucose and insulin after a</text><text x="36" y="992.8" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="800" fill="#18233D">test drink.</text><line x1="36" y1="1032" x2="564" y2="1032" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><text x="36" y="1075" font-family="Archivo, Arial, sans-serif" font-size="22" font-weight="500" fill="#536078">Dunstan et al. (2012), Diabetes Care</text><circle cx="557" cy="1072" r="7" fill="#FFE08A" stroke="none" stroke-width="0"/></svg>