troke="none"/><text x="84" y="590" font-family="Archivo, Arial, sans-serif" font-size="34" font-weight="800" fill="#18233D">Moderate walking</text><text x="84" y="628" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="500" fill="#536078">2-minute walk every 20 minutes</text><rect x="920" y="583" width="28" height="34" rx="7" fill="#18233D" stroke="none"/><rect x="962" y="583" width="28" height="34" rx="7" fill="#18233D" stroke="none"/><rect x="1004" y="583" width="28" height="34" rx="7" fill="#18233D" stroke="none"/><rect x="1046" y="583" width="28" height="34" rx="7" fill="#18233D" stroke="none"/><text x="56" y="727" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#18233D">Measured: glucose and insulin after a test drink.</text><line x1="56" y1="752" x2="1144" y2="752" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><text x="56" y="795" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="500" fill="#536078">Dunstan et al. (2012), Diabetes Care</text><circle cx="1137" cy="792" r="7" fill="#FFE08A" stroke="none" stroke-width="0"/></svg></section><section data-document-role="page" data-label="Keep the finding in context" style="width:1200px;height:850px;overflow:hidden"><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">Keep the finding in context</title><desc id="desc">The experiment tested walking, short laboratory sessions, and blood markers. It did not test stretching, a universal schedule, or long-term health outcomes.</desc><rect x="0" y="0" width="1200" height="850" rx="0" fill="#F7F9FC" stroke="none"/><rect x="0" y="0" width="12" height="850" rx="0" fill="#3155D9" stroke="none"/><text x="56" y="58" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="800" fill="#3155D9">DeskBreak</text><text x="953.3679999999999" y="58" font-family="Archivo, Arial, sans-serif" font-size="24" font-weight="500" fill="#536078">Reading research</text><text x="56" y="140" font-family="Archivo, Arial, sans-serif" font-size="58" font-weight="800" fill="#18233D">Keep the finding in context</text><text x="306" y="240" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="800" fill="#3155D9">What was tested</text><text x="686" y="240" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="800" fill="#536078">What it cannot establish</text><line x1="56" y1="399" x2="1144" y2="399" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><text x="56" y="336" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#18233D">The activity</text><text x="306" y="320" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#3155D9">Walking breaks</text><text x="686" y="320" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="500" fill="#536078">Not a stretching routine</text><line x1="56" y1="539" x2="1144" y2="539" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><text x="56" y="476" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#18233D">The setting</text><text x="306" y="460" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#3155D9">Short laboratory</text><text x="306" y="500.5" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#3155D9">sessions</text><text x="686" y="460" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="500" fill="#536078">Not months of desk work</text><line x1="56" y1="679" x2="1144" y2="679" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><text x="56" y="616" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#18233D">The outcome</text><text x="306" y="600" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#3155D9">Post-drink blood</text><text x="306" y="640.5" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#3155D9">markers</text><text x="686" y="600" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="500" fill="#536078">Not long-term health</text><rect x="56" y="687" width="1088" height="62" rx="12" fill="#FFE08A" stroke="none"/><text x="76" y="730" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#18233D">An experiment is not a universal schedule.</text><line x1="56" y1="762" x2="1144" y2="762" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><text x="56" y="805" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="500" fill="#536078">Study context: Dunstan et al. (2012)</text><circle cx="1137" cy="802" r="7" fill="#FFE08A" stroke="none" stroke-width="0"/></svg></section><section data-document-role="page" data-label="The 20-20-20 reminder" style="width:1200px;height:830px;overflow:hidden"><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc"><title id="title">The 20-20-20 reminder</title><desc id="desc">The mnemonic means every 20 minutes, look about 20 feet away, for 20 seconds. Twenty feet is about six metres.</desc><rect x="0" y="0" width="1200" height="830" rx="0" fill="#F7F9FC" stroke="none"/><rect x="0" y="0" width="12" height="830" rx="0" fill="#3155D9" stroke="none"/><text x="56" y="58" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="800" fill="#3155D9">DeskBreak</text><text x="924.016" y="58" font-family="Archivo, Arial, sans-serif" font-size="24" font-weight="500" fill="#536078">A familiar mnemonic</text><text x="56" y="140" font-family="Archivo, Arial, sans-serif" font-size="58" font-weight="800" fill="#18233D">The 20-20-20 reminder</text><text x="56" y="217" font-family="Archivo, Arial, sans-serif" font-size="31" font-weight="500" fill="#536078">A prompt to look beyond the screen.</text><rect x="56" y="265" width="344" height="338" rx="18" fill="#FFFFFF" stroke="none"/><g transform="translate(285 289) scale(0.8)"><circle cx="50" cy="50" r="35" fill="none" stroke="#18233D" stroke-width="4"/><line x1="50" y1="50" x2="50" y2="25" stroke="#3155D9" stroke-width="5"  stroke-linecap="round"/><line x1="50" y1="50" x2="70" y2="61" stroke="#3155D9" stroke-width="5"  stroke-linecap="round"/><circle cx="50" cy="50" r="4" fill="#18233D" stroke="none" stroke-width="0"/></g><text x="82" y="319" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="500" fill="#536078">Every</text><text x="79" y="470" font-family="Archivo, Arial, sans-serif" font-size="148" font-weight="800" fill="#3155D9">20</text><text x="84" y="535" font-family="Archivo, Arial, sans-serif" font-size="34" font-weight="800" fill="#18233D">minutes</text><rect x="427" y="265" width="344" height="338" rx="18" fill="#EDF0FF" stroke="none"/><g transform="translate(656 289) scale(0.8)"><rect x="11" y="15" width="78" height="68" rx="6" fill="#FFFFFF" stroke="#18233D"/><line x1="50" y1="15" x2="50" y2="83" stroke="#18233D" stroke-width="3"  stroke-linecap="round"/><line x1="11" y1="49" x2="89" y2="49" stroke="#18233D" stroke-width="3"  stroke-linecap="round"/><circle cx="72" cy="32" r="9" fill="#FFE08A" stroke="none" stroke-width="0"/><path d="M17 74L33 59L46 71M56 71L65 62L83 77" fill="none" stroke="#3155D9" stroke-width="3"/></g><text x="453" y="319" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="500" fill="#536078">Look about</text><text x="450" y="470" font-family="Archivo, Arial, sans-serif" font-size="148" font-weight="800" fill="#3155D9">20</text><text x="455" y="535" font-family="Archivo, Arial, sans-serif" font-size="34" font-weight="800" fill="#18233D">feet away</text><text x="455" y="573" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="500" fill="#536078">about 6 metres</text><rect x="798" y="265" width="344" height="338" rx="18" fill="#FFFFFF" stroke="none"/><g transform="translate(1027 289) scale(0.8)"><circle cx="50" cy="57" r="30" fill="none" stroke="#18233D" stroke-width="4"/><line x1="41" y1="13" x2="59" y2="13" stroke="#18233D" stroke-width="5"  stroke-linecap="round"/><line x1="50" y1="13" x2="50" y2="25" stroke="#18233D" stroke-width="4"  stroke-linecap="round"/><line x1="50" y1="57" x2="66" y2="40" stroke="#3155D9" stroke-width="5"  stroke-linecap="round"/><circle cx="50" cy="57" r="4" fill="#3155D9" stroke="none" stroke-width="0"/></g><text x="824" y="319" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="500" fill="#536078">For</text><text x="821" y="470" font-family="Archivo, Arial, sans-serif" font-size="148" font-weight="800" fill="#3155D9">20</text><text x="826" y="535" font-family="Archivo, Arial, sans-serif" font-size="34" font-weight="800" fill="#18233D">seconds</text><text x="56" y="692" font-family="Archivo, Arial, sans-serif" font-size="31" font-weight="800" fill="#18233D">The study did not compare alternative schedules.</text><line x1="56" y1="742" x2="1144" y2="742" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><text x="56" y="785" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="500" fill="#536078">Talens-Estarelles et al. (2023)</text><circle cx="1137" cy="782" r="7" fill="#FFE08A" stroke="none" stroke-width="0"/></svg></section><section data-document-role="page" data-label="What one small study tested" style="width:1200px;height:950px;overflow:hidden"><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc"><title id="title">What one small study tested</title><desc id="desc">Twenty-nine symptomatic computer users were monitored for two weeks without reminders, two weeks with reminders, and one week after reminders stopped.</desc><rect x="0" y="0" width="1200" height="950" rx="0" fill="#F7F9FC" stroke="none"/><rect x="0" y="0" width="12" height="950" rx="0" fill="#3155D9" stroke="none"/><text x="56" y="58" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="800" fill="#3155D9">DeskBreak</text><text x="1002.688" y="58" font-family="Archivo, Arial, sans-serif" font-size="24" font-weight="500" fill="#536078">Study design</text><text x="56" y="140" font-family="Archivo, Arial, sans-serif" font-size="58" font-weight="800" fill="#18233D">What one small study tested</text><rect x="56" y="208" width="481.12" height="46" rx="23" fill="#FFE08A" stroke="none"/><text x="72" y="240" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="800" fill="#18233D">29 symptomatic computer users</text><rect x="56" y="302" width="344" height="271" rx="16" fill="#FFFFFF" stroke="none"/><rect x="56" y="302" width="344" height="9" rx="3" fill="#DCE2EC" stroke="none"/><text x="80" y="375" font-family="Archivo, Arial, sans-serif" font-size="49" font-weight="800" fill="#18233D">2 weeks</text><text x="80" y="440" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#18233D">Baseline</text><text x="80" y="480.5" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#18233D">monitoring</text><text x="80" y="539" font-family="Archivo, Arial, sans-serif" font-size="26" font-weight="500" fill="#536078">No reminders</text><rect x="427" y="302" width="344" height="271" rx="16" fill="#FFFFFF" stroke="none"/><rect x="427" y="302" width="344" height="9" rx="3" fill="#3155D9" stroke="none"/><text x="451" y="375" font-family="Archivo, Arial, sans-serif" font-size="49" font-weight="800" fill="#3155D9">2 weeks</text><text x="451" y="440" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#18233D">20-20-20</text><text x="451" y="480.5" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#18233D">reminders</text><text x="451" y="539" font-family="Archivo, Arial, sans-serif" font-size="26" font-weight="500" fill="#536078">Software prompts</text><rect x="798" y="302" width="344" height="271" rx="16" fill="#FFFFFF" stroke="none"/><rect x="798" y="302" width="344" height="9" rx="3" fill="#18233D" stroke="none"/><text x="822" y="375" font-family="Archivo, Arial, sans-serif" font-size="49" font-weight="800" fill="#18233D">1 week</text><text x="822" y="440" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#18233D">After reminders</text><text x="822" y="480.5" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="800" fill="#18233D">stopped</text><text x="822" y="539" font-family="Archivo, Arial, sans-serif" font-size="26" font-weight="500" fill="#536078">Follow-up</text><text x="56" y="653" font-family="Archivo, Arial, sans-serif" font-size="32" font-weight="800" fill="#3155D9">Reported symptoms improved during reminders.</text><text x="56" y="719" font-family="Archivo, Arial, sans-serif" font-size="31" font-weight="500" fill="#18233D">Improvement was not clearly sustained after stopping.</text><text x="56" y="826" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="500" fill="#536078">Same people before and after. No separate control group.</text><line x1="56" y1="862" x2="1144" y2="862" stroke="#DCE2EC" stroke-width="2"  stroke-linecap="round"/><text x="56" y="905" font-family="Archivo, Arial, sans-serif" font-size="25" font-weight="500" fill="#536078">Talens-Estarelles et al. (2023)</text><circle cx="1137" cy="902" r="7" fill="#FFE08A" stroke="none" stroke-width="0"/></svg></section><section data-document-role="page" data-label="A desk was part of a programme" style="width:1200px;height:920px;overflow:hidden"><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">A desk was part of a programme</title><desc id="desc">A trial randomized 78 workplace clusters with 756 UK employees to usual practice, a sit-less programme, or the same programme plus a height-adjustable desk.</desc><rect x="0" y="0" width="1200" height="920" rx="0" fill="#F7F9FC" stroke="none"/><rect x="0" y="0" width="12" height="920" rx="0" fill="#3155D9" stroke="none"/><text x="56" y="58" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="800" fill="#3155D9">DeskBreak</text><text x="1002.688" y="58" font-family="Archivo, Arial, sans-serif" font-size="24" font-weight="500" fill="#536078">Study design</text><text x="56" y="140" font-family="Archivo, Arial, sans-serif" font-size="58" font-weight="800" fill="#18233D">A desk was part of a programme</text><text x="56" y="230" font-family="Archivo, Arial, sans-serif" font-size="31" font-weight="500" fill="#536078">756 UK employees. 78 workplace clusters.</text><rect x="56" y="290" width="344" height="335" rx="18" fill="#FFFFFF" stroke="none"/><g transform="translate(80 312) scale(1.02)"><circle cx="34" cy="29" r="12" fill="#FFE08A" stroke="#18233D" stroke-width="3"/><circle cx="70" cy="33" r="10" fill="#EDF0FF" stroke="#18233D" stroke-width="3"/><path d="M12 81V65Q12 48 34 48Q56 48 56 65V81M62 55Q89 55 89 71V81" fill="none" stroke="#18233D" stroke-width="4" stroke-linecap="round"/></g><text x="80" y="471" font-family="Archivo, Arial, sans-serif" font-size="34" font-weight="800" fill="#18233D">Usual practice</text><text x="80" y="558" font-family="Archivo, Arial, sans-serif" font-size="27" font-weight="500" fill="#536078">Control group</text><rect x="427" y="290" width="344" height="335" rx="18" fill="#FFFFFF" stroke="none"/><g transform="translate(451 312) scale(1.02)"><rect x="20" y="12" width="60" height="78" rx="6" fill="#FFFFFF" stroke="#18233D"/><rect x="35" y="6" width="30" height="15" rx="4" fill="#FFE08A" stroke="none"/><line x1="41" y1="37" x2="65" y2="37" stroke="#18233D" stroke-width="3"  stroke-linecap="round"/><line x1="41" y1="56" x2="65" y2="56" stroke="#18233D" stroke-width="3"  stroke-linecap="round"/><line x1="41" y1="75" x2="65" y2="75" stroke="#18233D" stroke-width="3"
